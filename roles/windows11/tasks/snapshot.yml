---
# Windows 11 VM snapshot management tasks

- name: Check if VM exists
  shell: virsh dominfo {{ vm_name }}
  register: vm_dominfo
  failed_when: false
  changed_when: false

- name: Fail if VM does not exist
  fail:
    msg: "VM '{{ vm_name }}' does not exist. Cannot perform '{{ vm_action }}' operation."
  when: vm_dominfo.rc != 0

# --- CREATE SNAPSHOT ---
- name: Create Windows 11 VM snapshot
  block:
    - name: Set effective snapshot name
      set_fact:
        effective_snapshot_name: >-
          {{ snapshot_name if (snapshot_name is defined and snapshot_name | length > 0)
             else (vm_name + '-snap-' + ansible_date_time.iso8601_basic_short) }}

    - name: Attempt standard snapshot creation for Windows 11 VM
      shell: >
        virsh snapshot-create-as
        --domain {{ vm_name }}
        --name "{{ effective_snapshot_name | trim }}"
        --description "{{ snapshot_description }}"
        {{ '--disk-only' if (snapshot_disk_only | default(false) | bool) else '' }}
      register: snapshot_create_result
      failed_when: false

    - name: Get non-primary disk targets for disk-only fallback
      shell: |
        virsh domblklist {{ vm_name }} --details | awk '$1 == "file" && $2 == "disk" && $3 != "vda" {print "--diskspec " $3 ",snapshot=no"}' | tr '\n' ' '
      register: extra_diskspecs
      changed_when: false
      when:
        - snapshot_create_result.rc != 0
        - not (snapshot_disk_only | default(false) | bool)
        - "'pflash' in (snapshot_create_result.stderr | default('')) or 'Operation not supported' in (snapshot_create_result.stderr | default(''))"

    - name: Retry with --disk-only if UEFI/pflash blocks internal snapshot
      shell: >
        virsh snapshot-create-as
        --domain {{ vm_name }}
        --name "{{ effective_snapshot_name | trim }}"
        --description "{{ snapshot_description }}"
        --disk-only {{ extra_diskspecs.stdout | default('') }}
      register: snapshot_create_fallback
      failed_when: false
      when:
        - snapshot_create_result.rc != 0
        - not (snapshot_disk_only | default(false) | bool)
        - "'pflash' in (snapshot_create_result.stderr | default('')) or 'Operation not supported' in (snapshot_create_result.stderr | default(''))"

    - name: Fail if snapshot creation failed
      fail:
        msg: "Failed to create snapshot '{{ effective_snapshot_name | trim }}': {{ snapshot_create_fallback.stderr | default(snapshot_create_result.stderr) }}"
      when:
        - snapshot_create_result.rc != 0
        - snapshot_create_fallback is skipped or (snapshot_create_fallback.rc | default(1)) != 0

    - name: Display snapshot creation result
      debug:
        msg: "Snapshot '{{ effective_snapshot_name | trim }}' created successfully for VM '{{ vm_name }}'."

  when: vm_action in ['snapshot', 'snapshot_create']

# --- REVERT SNAPSHOT ---
- name: Revert Windows 11 VM to snapshot
  block:
    - name: Validate snapshot_name is provided for revert
      fail:
        msg: "snapshot_name is required to revert. Usage: make win11_snapshot_revert SNAPSHOT_NAME=<name> [VM_NAME=<vm>]"
      when: snapshot_name is not defined or snapshot_name | trim == ""

    - name: Revert VM to specified snapshot
      shell: virsh snapshot-revert --domain {{ vm_name }} --snapshotname "{{ snapshot_name | trim }}"
      register: snapshot_revert_result
      failed_when: false

    - name: Fallback revert for external disk-only snapshot
      block:
        - name: Check VM state before external snapshot revert
          shell: virsh domstate {{ vm_name }}
          register: revert_vm_state
          changed_when: false

        - name: Stop VM if running before resetting external snapshot overlay
          shell: virsh destroy {{ vm_name }}
          when: "'running' in revert_vm_state.stdout"
          ignore_errors: yes

        - name: Reset external snapshot overlay back to backing image state
          shell: |
            overlay="{{ libvirt_images_path }}/{{ vm_name }}.{{ snapshot_name | trim }}"
            if [ -f "$overlay" ]; then
              backing=$(qemu-img info "$overlay" | awk -F': ' '/^backing file:/ {print $2}' | awk '{print $1}')
              if [ -n "$backing" ]; then
                qemu-img create -f qcow2 -F qcow2 -b "$backing" "$overlay"
                chown libvirt-qemu:libvirt-qemu "$overlay"
                chmod 0644 "$overlay"
              fi
            fi
          become: yes

        - name: Restart VM if it was running before revert
          shell: virsh start {{ vm_name }}
          when: "'running' in revert_vm_state.stdout"
      when:
        - snapshot_revert_result.rc != 0
        - "'external' in (snapshot_revert_result.stderr | default('')) or 'not supported' in (snapshot_revert_result.stderr | default(''))"

    - name: Fail if snapshot revert failed for other reasons
      fail:
        msg: "Failed to revert to snapshot '{{ snapshot_name | trim }}': {{ snapshot_revert_result.stderr }}"
      when:
        - snapshot_revert_result.rc != 0
        - not ("'external' in (snapshot_revert_result.stderr | default('')) or 'not supported' in (snapshot_revert_result.stderr | default(''))")

    - name: Display snapshot revert result
      debug:
        msg: "VM '{{ vm_name }}' reverted to snapshot '{{ snapshot_name | trim }}'."

  when: vm_action == 'snapshot_revert'

# --- DELETE SNAPSHOT ---
- name: Delete Windows 11 VM snapshot
  block:
    - name: Validate snapshot_name is provided for delete
      fail:
        msg: "snapshot_name is required to delete. Usage: make win11_snapshot_delete SNAPSHOT_NAME=<name> [VM_NAME=<vm>]"
      when: snapshot_name is not defined or snapshot_name | trim == ""

    - name: Delete specified snapshot from VM
      shell: virsh snapshot-delete --domain {{ vm_name }} --snapshotname "{{ snapshot_name | trim }}"
      register: snapshot_delete_result
      failed_when: false

    - name: Retry snapshot delete with --metadata if external disk-only snapshot
      shell: virsh snapshot-delete --domain {{ vm_name }} --snapshotname "{{ snapshot_name | trim }}" --metadata
      register: snapshot_delete_metadata_result
      when:
        - snapshot_delete_result.rc != 0
        - "'external' in (snapshot_delete_result.stderr | default('')) or 'not supported' in (snapshot_delete_result.stderr | default(''))"

    - name: Fail if snapshot deletion failed
      fail:
        msg: "Failed to delete snapshot '{{ snapshot_name | trim }}': {{ snapshot_delete_metadata_result.stderr | default(snapshot_delete_result.stderr) }}"
      when:
        - snapshot_delete_result.rc != 0
        - snapshot_delete_metadata_result is skipped or (snapshot_delete_metadata_result.rc | default(1)) != 0

    - name: Display snapshot delete result
      debug:
        msg: "Snapshot '{{ snapshot_name | trim }}' deleted from VM '{{ vm_name }}'."

  when: vm_action == 'snapshot_delete'

# --- CREATE NEW VM FROM SNAPSHOT (CLONE) ---
- name: Create new Windows 11 VM from snapshot
  block:
    - name: Validate snapshot_name and new_vm_name are provided
      fail:
        msg: >
          Both snapshot_name and new_vm_name are required (and must differ from source vm_name).
          Usage: make win11_snapshot_clone SNAPSHOT_NAME=<snap> NEW_VM_NAME=<new_vm> [VM_NAME=<source_vm>]
      when: >
        (snapshot_name is not defined or snapshot_name | trim == "") or
        (new_vm_name is not defined or new_vm_name | trim == "") or
        (new_vm_name | trim == vm_name | trim)

    - name: Verify snapshot exists on source Windows 11 VM
      shell: virsh snapshot-info --domain {{ vm_name }} --snapshotname "{{ snapshot_name | trim }}"
      register: snapshot_info_check
      changed_when: false

    - name: Check if target new VM already exists
      shell: virsh dominfo {{ new_vm_name | trim }}
      register: new_vm_exists
      failed_when: false
      changed_when: false

    - name: Fail if new VM already exists and force_recreate is false
      fail:
        msg: "Target VM '{{ new_vm_name | trim }}' already exists. Set force_recreate=true to overwrite it."
      when:
        - new_vm_exists.rc == 0
        - not (force_recreate | default(false) | bool)

    - name: Remove existing target VM if force_recreate is true
      block:
        - name: Force destroy existing target VM
          shell: virsh destroy {{ new_vm_name | trim }}
          ignore_errors: yes

        - name: Undefine existing target VM and NVRAM
          shell: virsh undefine {{ new_vm_name | trim }} --nvram --snapshots-metadata
          ignore_errors: yes

        - name: Remove existing target VM disk
          file:
            path: "{{ libvirt_images_path }}/{{ new_vm_name | trim }}.img"
            state: absent
          become: yes
      when:
        - new_vm_exists.rc == 0
        - force_recreate | default(false) | bool

    - name: Create workspace directory for new Windows 11 VM
      file:
        path: "{{ work_directory }}/{{ new_vm_name | trim }}"
        state: directory
        mode: '0755'

    - name: Extract internal snapshot disk to new Windows 11 VM disk image
      shell: >
        qemu-img convert -f qcow2 -O qcow2
        -l snapshot.name="{{ snapshot_name | trim }}"
        "{{ libvirt_images_path }}/{{ vm_name }}.img"
        "{{ libvirt_images_path }}/{{ new_vm_name | trim }}.img"
      become: yes
      register: convert_internal_snap
      failed_when: false

    - name: Fallback to copying base disk image for external disk-only snapshot
      shell: >
        qemu-img convert -f qcow2 -O qcow2
        "{{ libvirt_images_path }}/{{ vm_name }}.img"
        "{{ libvirt_images_path }}/{{ new_vm_name | trim }}.img"
      become: yes
      when: convert_internal_snap.rc != 0

    - name: Set ownership of new Windows 11 VM disk image
      file:
        path: "{{ libvirt_images_path }}/{{ new_vm_name | trim }}.img"
        owner: libvirt-qemu
        group: libvirt-qemu
        mode: '0644'
      become: yes

    - name: Create and start new Windows 11 VM from snapshot disk
      shell: >
        virt-install
        --name={{ new_vm_name | trim }}
        --memory={{ vm_ram }}
        --vcpus={{ vm_vcpus }}
        --os-variant={{ vm_os_variant }}
        --machine={{ vm_machine_type }}
        --cpu={{ vm_cpu }}
        --import
        --disk path={{ libvirt_images_path }}/{{ new_vm_name | trim }}.img,bus=virtio,format=qcow2
        --network {{ vm_network }}
        --graphics {{ vm_graphics }}
        --noautoconsole
        --boot uefi
        --features smm=on
        --tpm emulator,model=tpm-crb,version=2.0
      register: snapshot_clone_result

    - name: Create VM inventory entry for cloned Windows 11 VM
      copy:
        content: |
          # Individual inventory for VM: {{ new_vm_name | trim }} (cloned from {{ vm_name }}@{{ snapshot_name | trim }})
          # Created: {{ ansible_date_time.iso8601 }}
          all:
            hosts:
              {{ new_vm_name | trim }}:
                ansible_host: "PENDING - get from: virsh domifaddr {{ new_vm_name | trim }}"
                ansible_user: Administrator
                ansible_connection: winrm
                ansible_winrm_transport: ntlm
                vm_created: "{{ ansible_date_time.iso8601 }}"
                cloned_from_vm: "{{ vm_name }}"
                cloned_from_snapshot: "{{ snapshot_name | trim }}"
                vm_ram: {{ vm_ram }}
                vm_vcpus: {{ vm_vcpus }}
                vm_disk_size: "{{ vm_disk_size }}"
                vm_os_variant: "{{ vm_os_variant }}"
        dest: "{{ playbook_dir }}/../inventory/vm-{{ new_vm_name | trim }}.yml"
        mode: '0644'

    - name: Display new Windows 11 VM creation from snapshot result
      debug:
        msg: |
          New Windows 11 VM '{{ new_vm_name | trim }}' created successfully from '{{ vm_name }}' snapshot '{{ snapshot_name | trim }}'!
          Disk: {{ libvirt_images_path }}/{{ new_vm_name | trim }}.img
          Inventory: {{ playbook_dir }}/../inventory/vm-{{ new_vm_name | trim }}.yml

  when: vm_action == 'snapshot_clone'

# --- LIST SNAPSHOTS (runs on snapshot_list and after create/revert/delete) ---
- name: List snapshots for Windows 11 VM
  shell: virsh snapshot-list --domain {{ vm_name }}
  register: snapshot_list_result
  changed_when: false

- name: Display Windows 11 VM snapshots
  debug:
    msg: "{{ snapshot_list_result.stdout_lines }}"
